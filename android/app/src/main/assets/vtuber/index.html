// GPU Zero-Copy Side-by-Side Alpha Pack compositor (#cout: 2W x H, left=RGB, right=Alpha)
let zcGl = null, zcProg = null, zcTex = null, zcVao = null;
function initZeroCopyPacker() {
  if (!zeroCopyAlphaPack || zcGl) return;
  const gl = cout.getContext('webgl2', {
    alpha: false, antialias: false, depth: false, stencil: false,
    premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance'
  });
  if (!gl) {
    console.warn('Zero-copy alpha-pack WebGL2 unavailable');
    return;
  }
  const vsSrc = `#version 300 es
    out vec2 v_uv;
    void main() {
      vec2 p = vec2(gl_VertexID == 1 ? 3.0 : -1.0, gl_VertexID == 2 ? 3.0 : -1.0);
      gl_Position = vec4(p, 0.0, 1.0);
      v_uv = p * 0.5 + 0.5;
    }`;
  const fsSrc = `#version 300 es
    precision mediump float;
    in vec2 v_uv;
    uniform sampler2D u_src;
    out vec4 outColor;
    void main() {
      if (v_uv.x < 0.5) {
        vec4 c = texture(u_src, vec2(v_uv.x * 2.0, v_uv.y));
        outColor = vec4(c.rgb, 1.0);
      } else {
        float a = texture(u_src, vec2((v_uv.x - 0.5) * 2.0, v_uv.y)).a;
        outColor = vec4(a, a, a, 1.0);
      }
    }`;
  const compile = (type, src) => {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error('ZC shader error:', gl.getShaderInfoLog(sh));
      gl.deleteShader(sh);
      return null;
    }
    return sh;
  };
  const vs = compile(gl.VERTEX_SHADER, vsSrc);
  const fs = compile(gl.FRAGMENT_SHADER, fsSrc);
  if (!vs || !fs) return;
  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  gl.deleteShader(vs);
  gl.deleteShader(fs);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error('ZC link error:', gl.getProgramInfoLog(prog));
    return;
  }
  zcGl = gl;
  zcProg = prog;
  zcVao = gl.createVertexArray();
  zcTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, zcTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  cout.style.display = 'block';
  console.log('VTuber GPU Zero-Copy side-by-side alpha-pack ready viewport=' + window.innerWidth + 'x' + window.innerHeight + ' dpr=' + window.devicePixelRatio);
}

function packZeroCopyCanvas(srcCanvas, w, h) {
  initZeroCopyPacker();
  if (!zcGl || !zcProg || !srcCanvas) return;
  const outW = w * 2;
  if (cout.width !== outW || cout.height !== h) {
    cout.width = outW;
    cout.height = h;
  }
  const gl = zcGl;
  gl.viewport(0, 0, outW, h);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, zcTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, srcCanvas);
  gl.useProgram(zcProg);
  gl.bindVertexArray(zcVao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// Legacy fallback frame upload state (used only when zeroCopyAlphaPack is false)
let glPixelBuf = null;
let frameInFlight = false;
let lastPushMs = 0;
let messageBuffer = null;
let pboState = null;
function asyncReadPixels(gl, w, h) {
  if (!gl.fenceSync || !gl.getBufferSubData || gl.isContextLost()) return null;
  const size = w * h * 4;
  if (!pboState || pboState.gl !== gl || pboState.size !== size) {
    if (pboState) for (const slot of pboState.slots) {
      if (slot.sync) pboState.gl.deleteSync(slot.sync);
      pboState.gl.deleteBuffer(slot.buffer);
    }
    pboState = {gl, size, slots: [], next: 0};
    for (let i = 0; i < 3; ++i) {
      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.PIXEL_PACK_BUFFER, buffer);
      gl.bufferData(gl.PIXEL_PACK_BUFFER, size, gl.STREAM_READ);
      pboState.slots.push({buffer, sync: null, order: 0});
    }
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
  }
  let pixels = null;
  const pending = pboState.slots.filter(s => s.sync).sort((a,b) => a.order - b.order);
  if (pending.length) {
    const slot = pending[0];
    const ready = gl.clientWaitSync(slot.sync, 0, 0);
    if (ready === gl.ALREADY_SIGNALED || ready === gl.CONDITION_SATISFIED) {
      if (!glPixelBuf || glPixelBuf.length !== size) glPixelBuf = new Uint8Array(size);
      gl.bindBuffer(gl.PIXEL_PACK_BUFFER, slot.buffer);
      gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, glPixelBuf);
      gl.deleteSync(slot.sync); slot.sync = null;
      pixels = glPixelBuf;
    }
  }
  const slot = pboState.slots.find(s => !s.sync);
  if (slot) {
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, slot.buffer);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, 0);
    slot.sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
    slot.order = ++pboState.next;
    gl.flush();
  }
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
  return pixels;
}

function getRenderSize() {

  const h = Math.max(128, Math.min(1280, cfg.height || window.innerHeight || 768));
  return [w, h];
}

    renderer.setSize(w, h, false);

    pixiApp.renderer.resize(w, h);
    fitLive2dModel();
  }
  if (zeroCopyAlphaPack && (cout.width !== w * 2 || cout.height !== h)) {
    cout.width = w * 2;
    cout.height = h;
  }
}

function buildProcedural3DAvatar() {
  const root = new THREE.Group();
  root.position.set(0, 1.35, 0);
  const head = new THREE.Group();
  root.add(head);
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xffe4d0, roughness: 0.55 });
  const hairMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.45 });
  const darkMat = new THREE.MeshBasicMaterial({ color: 0x1e293b });
  const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const mouthMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e });

  head.add(new THREE.Mesh(new THREE.SphereGeometry(0.16, 32, 24), skinMat));
  const hairCap = new THREE.Mesh(new THREE.SphereGeometry(0.172, 32, 20, 0, Math.PI * 2, 0, Math.PI * 0.58), hairMat);
  hairCap.position.set(0, 0.015, -0.008);
  head.add(hairCap);

  const eyeL = new THREE.Group(); eyeL.position.set(-0.055, 0.015, 0.145);
  eyeL.add(new THREE.Mesh(new THREE.SphereGeometry(0.024, 16, 16), darkMat));
  const hiL = new THREE.Mesh(new THREE.SphereGeometry(0.008, 10, 10), whiteMat);
  hiL.position.set(0.008, 0.008, 0.02); eyeL.add(hiL);
  head.add(eyeL);

  const eyeR = new THREE.Group(); eyeR.position.set(0.055, 0.015, 0.145);
  eyeR.add(new THREE.Mesh(new THREE.SphereGeometry(0.024, 16, 16), darkMat));
  const hiR = new THREE.Mesh(new THREE.SphereGeometry(0.008, 10, 10), whiteMat);
  hiR.position.set(0.008, 0.008, 0.02); eyeR.add(hiR);
  head.add(eyeR);

  const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.024, 16, 12), mouthMat);
  mouth.position.set(0, -0.055, 0.145);
  mouth.scale.set(1.2, 0.2, 0.4);
  head.add(mouth);

  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.16, 0.34, 24), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
  body.position.set(0, -0.27, 0);
  root.add(body);
  root.userData = { head, eyeL, eyeR, mouth };
  return root;
}

function bindVrmaClip() {
  if (!currentVrm || !pendingVrmaData) {
    if (vrmaAction) { vrmaAction.stop(); vrmaAction = null; }
    vrmaMixer = null;
    return;
  }
  try {
    vrmaMixer = new THREE.AnimationMixer(currentVrm.scene);
    const clip = createVRMAnimationClip(pendingVrmaData, currentVrm);
    vrmaAction = vrmaMixer.clipAction(clip);
    vrmaAction.setLoop(cfg.vrmaLoop === false ? THREE.LoopOnce : THREE.LoopRepeat, Infinity);
    vrmaAction.clampWhenFinished = true;
    vrmaAction.reset().play();
    console.log('VRMA animation bound: ' + loadedVrmaUrl + ' duration=' + clip.duration.toFixed(2) + 's');
  } catch (e) {
    console.warn('VRMA clip bind failed:', e);
    vrmaMixer = null;
    vrmaAction = null;
  }
}

async function loadVrmaAnimation(url) {
  if (!url) {
    loadedVrmaUrl = '';
    pendingVrmaData = null;
    if (vrmaAction) { vrmaAction.stop(); vrmaAction = null; }
    vrmaMixer = null;
    return;
  }
  if (url === loadedVrmaUrl && pendingVrmaData) {
    if (vrmaAction) vrmaAction.setLoop(cfg.vrmaLoop === false ? THREE.LoopOnce : THREE.LoopRepeat, Infinity);
    return;
  }
  loadedVrmaUrl = url;
  try {
    const loader = new GLTFLoader();
    loader.register((parser) => new VRMAnimationLoaderPlugin(parser));
    const gltf = await loader.loadAsync(url);
    const anims = gltf.userData && gltf.userData.vrmAnimations;
    if (anims && anims.length > 0) {
      pendingVrmaData = anims[0];
      bindVrmaClip();
    } else {
      console.warn('No VRMAnimation found in ' + url);
      pendingVrmaData = null;
    }
  } catch (e) {
    console.warn('VRMA load failed:', e);
    loadedVrmaUrl = '';
    pendingVrmaData = null;
  }
}

async function loadVrmModel(url) {
  ensureThree();
  if (!url) {
    if (currentVrm) { scene.remove(currentVrm.scene); VRMUtils.deepDispose(currentVrm.scene); currentVrm = null; }
    loadedVrmUrl = '';
    vrmaMixer = null; vrmaAction = null;
    if (demoHead) demoHead.visible = true;
    return;
  }
  if (url === loadedVrmUrl && currentVrm) return;
  loadedVrmUrl = url;
  try {
    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));
    const gltf = await loader.loadAsync(url);
    const vrm = gltf.userData.vrm;
    if (!vrm) {
      console.warn('File loaded as glTF but missing VRM extension; using 3D avatar fallback.');
      if (demoHead) demoHead.visible = true;
      return;
    }
    if (currentVrm) { scene.remove(currentVrm.scene); VRMUtils.deepDispose(currentVrm.scene); }
    VRMUtils.rotateVRM0(vrm);
    const maxAniso = renderer && renderer.capabilities ? Math.min(8, renderer.capabilities.getMaxAnisotropy()) : 4;
    vrm.scene.traverse((obj) => {
      if (!obj.isMesh || !obj.material) return;
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      for (const m of mats) {
        for (const k of ['map', 'emissiveMap', 'normalMap', 'shadeMultiplyTexture']) {
          if (m[k] && m[k].isTexture) {
            m[k].anisotropy = maxAniso;
            m[k].needsUpdate = true;
          }
        }
      }
    });
    currentVrm = vrm;
    scene.add(vrm.scene);
    // Apply relaxed A-pose immediately and reset spring bones BEFORE first frame so clothes/hair never fly upward!
    const initHum = vrm.humanoid;
    if (initHum) {
      const lU = initHum.getNormalizedBoneNode('leftUpperArm');
      const rU = initHum.getNormalizedBoneNode('rightUpperArm');
      const lL = initHum.getNormalizedBoneNode('leftLowerArm');
      const rL = initHum.getNormalizedBoneNode('rightLowerArm');
      if (lU) lU.rotation.set(0.08, 0.06, 1.22);
      if (rU) rU.rotation.set(0.08, -0.06, -1.22);
      if (lL) lL.rotation.set(0.05, 0.14, 0.10);
      if (rL) rL.rotation.set(0.05, -0.14, -0.10);
    }
    vrm.update(0);
    vrm.scene.updateMatrixWorld(true);
    if (vrm.springBoneManager) vrm.springBoneManager.reset();
    vrmSettleFrames = 8;
    clock.getDelta();
    if (demoHead) demoHead.visible = false;
    if (pendingVrmaData) bindVrmaClip();
    console.log('Loaded VRM model successfully: ' + url + ' aniso=' + maxAniso);
  } catch (e) {
    console.warn('VRM load failed (note: .vroid must be exported as .vrm in VRoid Studio):', e);
    if (demoHead) demoHead.visible = true;
  }
}

// ---------- VRM Finger / Gesture / VMC Bone Helpers ----------
const VMC_TO_VRM_BONE = {
  Hips: 'hips', Spine: 'spine', Chest: 'chest', UpperChest: 'upperChest',
  Neck: 'neck', Head: 'head',
  LeftShoulder: 'leftShoulder', RightShoulder: 'rightShoulder',
  LeftUpperArm: 'leftUpperArm', RightUpperArm: 'rightUpperArm',
  LeftLowerArm: 'leftLowerArm', RightLowerArm: 'rightLowerArm',
  LeftHand: 'leftHand', RightHand: 'rightHand'
};

function applyVrmFingers(hum, side, curl, gesture) {
  const s = side === 'L' ? 1 : -1;
  const pfx = side === 'L' ? 'left' : 'right';
  const fingers = ['Index', 'Middle', 'Ring', 'Little'];
  for (let i = 0; i < fingers.length; ++i) {
    let fCurl = curl;
    if (gesture === 3) { // peace ✌️: index + middle open, ring + pinky curled
      fCurl = (i < 2) ? 0.05 : 1.0;
    } else if (gesture === 4) { // point ☝️: index open, others curled
      fCurl = (i === 0) ? 0.05 : 1.0;
    } else if (gesture === 2) { // fist ✊
      fCurl = 1.0;
    } else if (gesture === 1) { // open ✋
      fCurl = 0.05;
    }
    const prox = hum?.getNormalizedBoneNode(pfx + fingers[i] + 'Proximal');
    const inter = hum?.getNormalizedBoneNode(pfx + fingers[i] + 'Intermediate');
    if (prox) {
      prox.rotation.z = s * fCurl * 1.15;
      if (gesture === 3) {
        prox.rotation.y = (i === 0 ? 0.16 : i === 1 ? -0.16 : 0) * s;
      } else {
        prox.rotation.y = 0;
      }
    }
    if (inter) inter.rotation.z = s * fCurl * 1.05;
  }
  const thumb = hum?.getNormalizedBoneNode(pfx + 'ThumbProximal');
  if (thumb) thumb.rotation.y = -s * (gesture === 2 || gesture === 3 ? 0.72 : gesture === 1 ? 0.05 : curl * 0.45);
}

// ---------- Live2D ----------
function loadScript(src) {
  return new Promise((resolve) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve(true);
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
}

async function ensureLive2dCore() {
  if (window.Live2DCubismCore && window.PIXI && window.PIXI.live2d) {
    cubismReady = true;
    return true;
  }
  if (cubismLoadingPromise) return cubismLoadingPromise;
  cubismLoadingPromise = (async () => {
    const bust = '?t=' + Date.now();
    if (!window.Live2DCubismCore) {
      const okCore = await loadScript('/vtuber/live2dcubismcore.min.js' + bust);
      if (!okCore || !window.Live2DCubismCore) {
        console.warn('live2dcubismcore.min.js not imported yet.');
        live2dStatusText = 'Importa live2dcubismcore.min.js en Propiedades';
        return false;
      }
    }
    if (!(window.PIXI && window.PIXI.live2d)) {
      await loadScript('/vtuber/lib/cubism4.min.js' + bust);
    }
    cubismReady = !!(window.Live2DCubismCore && window.PIXI && window.PIXI.live2d);
    if (!cubismReady) {
      live2dStatusText = 'Error al inicializar Cubism4 Runtime';
    }
    return cubismReady;
  })();
  try {
    return await cubismLoadingPromise;
  } finally {
    cubismLoadingPromise = null;
  }
}

function fitLive2dModel() {
  if (!live2dModel || !pixiApp) return;
  const w = pixiApp.renderer.width, h = pixiApp.renderer.height;
  const mw = (live2dModel.internalModel && live2dModel.internalModel.width) || live2dModel.width || 1;
  const mh = (live2dModel.internalModel && live2dModel.internalModel.height) || live2dModel.height || 1;
  if (mw > 0 && mh > 0) {
    const framing = cfg.live2dFraming || 'bust';
    let baseZoom = 1.85;
    let baseY = 0.86;
    if (framing === 'closeup') {
      baseZoom = 2.55;
      baseY = 1.12;
    } else if (framing === 'full') {
      baseZoom = 0.94;
      baseY = 0.52;
    }
    const zoomMul = Math.max(0.4, Math.min(4.0, Number(cfg.live2dZoom) || 1.0));
    const offY = Math.max(-1.0, Math.min(1.0, Number(cfg.live2dOffsetY) || 0.0));
    const scale = Math.min(w / mw, h / mh) * baseZoom * zoomMul;
    if (live2dModel.anchor) live2dModel.anchor.set(0.5, 0.5);
    live2dModel.scale.set(scale);
    live2dModel.position.set(w * 0.5, h * (baseY + offY * 0.55));
  }
}

async function discoverLive2dWaveParams(model3Url) {
  const info = {
    toggleIds: [], swingIds: [], armLIds: [], armRIds: [],
    happyIds: [], gloomIds: [], starIds: [], starRotIds: [], cryIds: [], cryLoopIds: [], coatIds: []
  };
  try {
    const r = await fetch(model3Url);
    if (!r.ok) return info;
    const m3 = await r.json();
    const cdiRel = m3 && m3.FileReferences && m3.FileReferences.DisplayInfo;
    if (!cdiRel) return info;
    const cdiUrl = new URL(cdiRel, model3Url).toString();
    const rc = await fetch(cdiUrl);
    if (!rc.ok) return info;
    const cdi = await rc.json();
    const plist = (cdi && cdi.Parameters) || [];
    for (const p of plist) {
      const id = String(p.Id || '');
      const nm = String(p.Name || '').toLowerCase();
      const idLow = id.toLowerCase();
      if (!id) continue;
      if (nm.includes('wave') || nm.includes('salu') || idLow.includes('wave')) {
        if (nm.includes('toggle') || nm.includes('on') || nm.includes('show') || nm.includes('enable')) {
          info.toggleIds.push(id);
        } else {
          info.swingIds.push(id);
        }
      } else if (nm.includes('arm') || nm.includes('hand')) {
        if (nm.includes('left') || idLow.includes('arml') || idLow.includes('handl')) info.armLIds.push(id);
        else if (nm.includes('right') || idLow.includes('armr') || idLow.includes('handr')) info.armRIds.push(id);
      } else if (nm.includes('sparkle') || nm.includes('happy') || nm.includes('heart') || idLow.includes('happysparkle')) {
        info.happyIds.push(id);
      } else if (nm.includes('gloom') || nm.includes('angry') || nm.includes('shadow') || nm.includes('dark') || idLow.includes('gloom')) {
        info.gloomIds.push(id);
      } else if (nm.includes('star') || idLow.includes('stareye') || idLow === 'serr' || idLow === 'serl') {
        if (nm.includes('rot') || nm.includes('spin') || idLow === 'serr' || idLow === 'serl') info.starRotIds.push(id);
        else info.starIds.push(id);
      } else if (nm.includes('cry') || nm.includes('tear')) {
        if (nm.includes('loop') || nm.includes('anim')) info.cryLoopIds.push(id);
        else info.cryIds.push(id);
      } else if (nm.includes('coat') || nm.includes('jacket') || nm.includes('capa') || nm.includes('outfit')) {
        info.coatIds.push(id);
      }
    }
  } catch (e) {}
  return info;
}

function getActiveGesture() {
  return (track.gesture && track.gesture.length > 0) ? track.gesture : (cfg.gesture || '');
}

function applyLive2dParams(model) {
  const core = model && model.internalModel && model.internalModel.coreModel;
  if (!core || !core.setParameterValueById) return;
  const t = clock.elapsedTime;
  const breath = 0.5 + 0.5 * Math.sin(t * 2.1);
  const sway = Math.sin(t * 0.9);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const sens = Math.max(0.4, Math.min(2.5, Number(cfg.headSensitivity) || 1.0));
  const handOn = cfg.handTracking !== false;
  const actGest = getActiveGesture();
  const suppressWave = (actGest === 'clap' || actGest === 'peace' || actGest === 'think' || actGest === 'dance');
  const gestWave = (actGest === 'wave') ? 1.0 : 0;
  const rawHand = (handOn && !suppressWave) ? Math.max(track.handL || 0, track.handR || 0) : 0;
  const cleanHand = rawHand > 0.20 ? (rawHand - 0.20) / 0.80 : 0;
  const targetWave = Math.max(cleanHand, gestWave);
  live2dWaveBlend += (targetWave - live2dWaveBlend) * (targetWave > live2dWaveBlend ? 0.25 : 0.14);
  if (live2dWaveBlend < 0.01) live2dWaveBlend = 0;

  const waveSwing = Math.sin(t * 7.8) * 0.72 + clamp(track.waveOsc || 0, -1, 1) * 0.28;
  const isClap = actGest === 'clap';
  const isPeace = actGest === 'peace';
  const clapBeat = isClap ? Math.abs(Math.sin(t * 7.5)) : 0;
  const clapSway = isClap ? Math.sin(t * 3.75) : 0;
  const danceX = actGest === 'dance' ? Math.sin(t * 3.8) * 14 : 0;
  const danceZ = actGest === 'dance' ? Math.sin(t * 3.8) * 11 : 0;
  const thinkRoll = actGest === 'think' ? -14 : 0;
  const invX = cfg.invertX ? -1 : 1;
  const invY = cfg.invertY ? -1 : 1;
  const yaw = clamp(sm.yaw * sens * invX + danceX + (isPeace ? 10 : 0), -30, 30);
  const pitch = clamp(sm.pitch * sens * invY + (actGest === 'think' ? 8 : 0) + (isClap ? (clapBeat * 10.0 - 3.5) : 0) + (isPeace ? 5 : 0), -30, 30);
  const roll = clamp(-sm.roll * sens * invX + live2dWaveBlend * 7.0 + danceZ + thinkRoll + (isClap ? clapSway * 7.5 : 0) + (isPeace ? -16 : 0), -30, 30);
  const smile = clamp(Math.max(track.happy || 0, live2dWaveBlend * 0.65, (actGest === 'happy' || isClap || isPeace) ? 1 : 0), 0, 1);
  const sad = clamp(Math.max(track.sad || 0, actGest === 'sad' ? 1 : 0), 0, 1);
  const angry = clamp(Math.max(track.angry || 0, actGest === 'angry' ? 1 : 0), 0, 1);
  const surprised = clamp(Math.max(track.surprised || 0, actGest === 'surprised' ? 1 : 0), 0, 1);

  const eyeBallX = (track.mp || track.vmc) ? clamp(-sm.lookX * invX, -1, 1) : clamp(yaw / 24, -1, 1);
  const eyeBallY = (track.mp || track.vmc) ? clamp(sm.lookY * invY, -1, 1) : clamp(pitch / 24, -1, 1);
  // Mirror brows & eye smiles to match selfie view (user right -> character left)
  const browL = (track.mp || track.vmc) ? clamp(sm.browR, -1, 1) : clamp(sad * 0.55 + surprised * 0.85 - angry * 0.8, -1, 1);
  const browR = (track.mp || track.vmc) ? clamp(sm.browL, -1, 1) : clamp(sad * 0.55 + surprised * 0.85 - angry * 0.8, -1, 1);
  const browAngL = (track.mp || track.vmc) ? clamp(sm.browAngleR, -1, 1) : clamp(sad * 0.7 - angry * 0.9, -1, 1);
  const browAngR = (track.mp || track.vmc) ? clamp(sm.browAngleL, -1, 1) : clamp(sad * 0.7 - angry * 0.9, -1, 1);
  const browFormL = clamp(smile * 0.65 + surprised * 0.35 - angry * 0.95 - sad * 0.45, -1, 1);
  const browFormR = clamp(smile * 0.65 + surprised * 0.35 - angry * 0.95 - sad * 0.45, -1, 1);
  const browPinch = clamp(-angry * 0.65 - sad * 0.30, -1, 1);

  // Rich lip-sync: fuse ARKit mouth shape + dynamic microphone vowel contour
  const micNorm = cfg.lipSync ? clamp(track.mic / Math.max(0.018, cfg.voiceThreshold * 2.8), 0, 1) : 0;
  const mouthOpen = clamp(Math.max(sm.mouth, micNorm * 0.92, surprised * 0.78, isPeace ? 0.22 : 0, isClap ? clapBeat * 0.28 : 0), 0, 1);
  // Subtle syllable modulation on MouthForm when speaking by mic alone
  const micVowelMod = (!track.mp && micNorm > 0.15) ? (Math.sin(t * 14.0) * 0.35 * micNorm) : 0;
  const baseForm = (track.mp || track.vmc)
    ? sm.mouthForm
    : clamp(smile * 0.9 - sad * 0.75 - angry * 0.6 + micVowelMod, -1, 1);
  const mouthForm = clamp(baseForm + (actGest === 'happy' || isClap || isPeace ? 0.85 : 0) - (actGest === 'sad' ? 0.6 : 0), -1, 1);

  // Independent Duchenne eye smiles + wide-eyed surprise boost + Victory wink
  const eyeSmileL = clamp(Math.max((track.mp || track.vmc) ? sm.eyeSmileR : smile, (actGest === 'happy' || isClap) ? 0.95 : (isPeace ? 0.45 : 0)), 0, 1);
  const eyeSmileR = clamp(Math.max((track.mp || track.vmc) ? sm.eyeSmileL : smile, (actGest === 'happy' || isClap || isPeace) ? 1.0 : 0), 0, 1);
  const eyeOpenL = curAutoBlink ? 0 : clamp((isPeace ? 1.18 : sm.eyeR) + sm.eyeWideR * 0.35 + surprised * 0.25, 0, 1.35);
  const eyeOpenR = (curAutoBlink || isPeace) ? 0 : clamp(sm.eyeL + sm.eyeWideL * 0.35 + surprised * 0.25, 0, 1.35);

  // Smooth custom model expression overlays (auto-discovered from .cdi3.json + live touch toggles)
  const tgtHappyExp = (manualExp.happy || smile > 0.62 || actGest === 'happy' || isClap) ? 1 : 0;
  const tgtGloomExp = (manualExp.gloom || angry > 0.55 || sad > 0.60 || actGest === 'angry' || actGest === 'sad') ? 1 : 0;
  const tgtStarExp = (manualExp.star || surprised > 0.58 || isPeace) ? 1 : 0;
  const tgtCryExp = (manualExp.cry || sad > 0.68) ? 1 : 0;
  const tgtCoatExp = manualExp.coat ? 1 : 0;
  l2dExpBlend.happy += (tgtHappyExp - l2dExpBlend.happy) * 0.18;
  l2dExpBlend.gloom += (tgtGloomExp - l2dExpBlend.gloom) * 0.16;
  l2dExpBlend.star += (tgtStarExp - l2dExpBlend.star) * 0.20;
  l2dExpBlend.cry += (tgtCryExp - l2dExpBlend.cry) * 0.16;
  l2dExpBlend.coat += (tgtCoatExp - l2dExpBlend.coat) * 0.25;

  try {
    core.setParameterValueById('ParamAngleX', yaw);
    core.setParameterValueById('ParamAngleY', pitch);
    core.setParameterValueById('ParamAngleZ', roll);
    core.setParameterValueById('ParamBodyAngleX', clamp(sm.bodyYaw * sens * invX * 0.44 + sway * 2.0 + waveSwing * live2dWaveBlend * 2.8 + danceX * 0.4 + (isPeace ? 4.0 : 0), -10, 10));
    core.setParameterValueById('ParamBodyAngleY', clamp(sm.bodyPitch * sens * invY * 0.44 - sm.faceY * 4.5 + (isClap ? (clapBeat * 8.5 - 3.0) : 0), -10, 10));
    core.setParameterValueById('ParamBodyAngleZ', clamp(-sm.bodyRoll * sens * invX * 0.40 + Math.sin(t * 0.7) * 1.4 + waveSwing * live2dWaveBlend * 3.5 + danceZ * 0.5 + (isClap ? clapSway * 6.5 : 0) + (isPeace ? -6.0 : 0), -10, 10));

    core.setParameterValueById('ParamEyeLOpen', eyeOpenL);
    core.setParameterValueById('ParamEyeROpen', eyeOpenR);
    core.setParameterValueById('ParamEyeLSmile', eyeSmileL);
    core.setParameterValueById('ParamEyeRSmile', eyeSmileR);
    core.setParameterValueById('ParamEyeBallX', eyeBallX);
    core.setParameterValueById('ParamEyeBallY', eyeBallY);

    // Primary Cubism 4 Lip-Sync + optional VBridger / ARKit mouth params
    core.setParameterValueById('ParamMouthOpenY', mouthOpen);
    core.setParameterValueById('ParamMouthForm', mouthForm);
    core.setParameterValueById('ParamMouthX', clamp(-sm.mouthX * invX, -1, 1));
    core.setParameterValueById('MouthX', clamp(-sm.mouthX * invX, -1, 1));
    core.setParameterValueById('MouthOpen', mouthOpen);
    core.setParameterValueById('JawOpen', mouthOpen);
    core.setParameterValueById('MouthFunnel', clamp(track.mFunnel || 0, 0, 1));
    core.setParameterValueById('MouthPucker', clamp(track.mPucker || 0, 0, 1));
    core.setParameterValueById('MouthShrug', clamp(track.mShrug || 0, 0, 1));

    // Full 8-parameter eyebrow expressiveness
    core.setParameterValueById('ParamBrowLX', browPinch);
    core.setParameterValueById('ParamBrowRX', browPinch);
    core.setParameterValueById('ParamBrowLY', browL);
    core.setParameterValueById('ParamBrowRY', browR);
    core.setParameterValueById('ParamBrowLAngle', browAngL);
    core.setParameterValueById('ParamBrowRAngle', browAngR);
    core.setParameterValueById('ParamBrowLForm', browFormL);
    core.setParameterValueById('ParamBrowRForm', browFormR);

    core.setParameterValueById('ParamCheek', clamp(Math.max(live2dWaveBlend * 0.55, sm.cheekPuff, smile * 0.65, surprised * 0.30, isClap ? 0.8 : 0, isPeace ? 0.85 : 0), 0, 1));
    core.setParameterValueById('CheekPuff', clamp(sm.cheekPuff, 0, 1));
    core.setParameterValueById('ParamBreath', breath);

    // Auto-discovered custom expression toggles & loops (Sparkle, Star Eyes, Gloom, Cry)
    for (const id of live2dWaveInfo.happyIds) core.setParameterValueById(id, l2dExpBlend.happy);
    for (const id of live2dWaveInfo.gloomIds) core.setParameterValueById(id, l2dExpBlend.gloom);
    for (const id of live2dWaveInfo.starIds) core.setParameterValueById(id, l2dExpBlend.star);
    for (const id of live2dWaveInfo.starRotIds) core.setParameterValueById(id, ((t * 1.4) % 2) - 1);
    for (const id of live2dWaveInfo.cryIds) core.setParameterValueById(id, l2dExpBlend.cry);
    for (let i = 0; i < live2dWaveInfo.cryLoopIds.length; ++i) {
      core.setParameterValueById(live2dWaveInfo.cryLoopIds[i], (t * 1.8 + i * 0.25) % 1.0);
    }
    for (const id of live2dWaveInfo.coatIds) core.setParameterValueById(id, l2dExpBlend.coat);

    for (const id of live2dWaveInfo.toggleIds) core.setParameterValueById(id, live2dWaveBlend);
    for (const id of live2dWaveInfo.swingIds) core.setParameterValueById(id, waveSwing * 30 * live2dWaveBlend);
    const hL = (handOn && !suppressWave) ? clamp(track.handL || 0, 0, 1) : 0;
    const hR = Math.max((handOn && !suppressWave) ? clamp(track.handR || 0, 0, 1) : 0, actGest === 'wave' ? 1 : 0);
    for (const id of live2dWaveInfo.armLIds) core.setParameterValueById(id, hL * (1 + waveSwing * 0.25));
    for (const id of live2dWaveInfo.armRIds) core.setParameterValueById(id, hR * (1 + waveSwing * 0.25));
    for (const id of ['ParamArmLA', 'ParamArmL', 'ParamHandL']) core.setParameterValueById(id, hL * 10);
    for (const id of ['ParamArmRA', 'ParamArmR', 'ParamHandR']) core.setParameterValueById(id, hR * 10);
  } catch (e) {}
}

async function loadLive2dModel(url) {
  const seq = ++live2dLoadSeq;
  if (!url) {
    if (live2dModel && pixiApp) { pixiApp.stage.removeChild(live2dModel); live2dModel.destroy(); live2dModel = null; }
    loadedLive2dUrl = '';
    live2dWaveInfo = {
      toggleIds: [], swingIds: [], armLIds: [], armRIds: [],
      happyIds: [], gloomIds: [], starIds: [], starRotIds: [], cryIds: [], cryLoopIds: []
    };
    if (cfg.live2dPreparing) live2dStatusText = 'Descomprimiendo modelo Live2D (.zip)...';
    else if (cfg.live2dPrepError) live2dStatusText = cfg.live2dPrepError;
    else live2dStatusText = 'Selecciona un .zip o .model3.json en Propiedades';
    return;
  }
  if (url === loadedLive2dUrl && live2dModel) { live2dStatusText = ''; return; }
  live2dStatusText = 'Cargando Live2D...';
  const ready = await ensureLive2dCore();
  if (!ready || seq !== live2dLoadSeq) return;
  loadedLive2dUrl = url;
  const [w, h] = getRenderSize();
  if (!pixiApp) {
    pixiApp = new window.PIXI.Application({
      view: cl2d,
      transparent: true,
      backgroundAlpha: 0,
      clearBeforeRender: true,
      autoStart: false,
      preserveDrawingBuffer: true,
      antialias: true,
      powerPreference: 'high-performance',
      resolution: 1,
      width: w,
      height: h
    });
    console.log('VTuber PixiJS WebGL ready ' + w + 'x' + h);
  }
  try {
    console.log('Loading Live2D model: ' + url);
    const [model, waveInfo] = await Promise.all([
      window.PIXI.live2d.Live2DModel.from(url, { autoInteract: false, autoUpdate: false }),
      discoverLive2dWaveParams(url)
    ]);
    if (seq !== live2dLoadSeq) { model.destroy(); return; }
    if (live2dModel) { pixiApp.stage.removeChild(live2dModel); live2dModel.destroy(); }
    live2dWaveInfo = waveInfo;
    if (model.internalModel && model.internalModel.on) {
      model.internalModel.on('beforeModelUpdate', () => applyLive2dParams(model));
    }
    live2dModel = model;
    live2dStatusText = '';
    pixiApp.stage.addChild(model);
    fitLive2dModel();
    console.log('Loaded Live2D model successfully: ' + url);
  } catch (e) {
    loadedLive2dUrl = '';
    live2dStatusText = 'Error Live2D: ' + ((e && e.message) ? e.message.slice(0, 60) : 'modelo incompatible');
    console.error('Live2D load failed:', e && e.stack ? e.stack : e);
  }
}

// ---------- Inochi2D (.inp / .inx) Open-Source 2D Rigged Puppet Loader & Renderer ----------
async function loadInochi2dModel(url) {
  const seq = ++inochiLoadSeq;
  if (!url) {
    if (inochiModel && inochiModel.bitmaps) {
      for (const b of inochiModel.bitmaps) if (b && b.close) b.close();
    }
    inochiModel = null;
    loadedInochiUrl = '';
    return;
  }
  if (url === loadedInochiUrl && inochiModel) return;
  loadedInochiUrl = url;
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const buf = await resp.arrayBuffer();
    if (seq !== inochiLoadSeq) return;
    const u8 = new Uint8Array(buf);
    const dv = new DataView(buf);
    // Verify TRNSRTS\0 magic (8 bytes)
    const magic = String.fromCharCode(u8[0], u8[1], u8[2], u8[3], u8[4], u8[5], u8[6], u8[7]);
    if (magic !== 'TRNSRTS\0') throw new Error('Invalid Inochi2D magic: ' + magic);
    const jsonLen = dv.getUint32(8, false);
    const jsonText = new TextDecoder('utf-8').decode(u8.subarray(12, 12 + jsonLen));
    const puppet = JSON.parse(jsonText);

    // Parse TEX_SECT section
    let off = 12 + jsonLen;
    const bitmaps = [];
    if (off + 12 <= u8.length) {
      const secTag = String.fromCharCode(...u8.subarray(off, off + 8));
      if (secTag === 'TEX_SECT') {
        off += 8;
        const texCount = dv.getUint32(off, false);
        off += 4;
        for (let i = 0; i < texCount && off + 5 <= u8.length; ++i) {
          const tLen = dv.getUint32(off, false);
          const tFmt = u8[off + 4];
          off += 5;
          if (off + tLen > u8.length) break;
          const mime = (tFmt === 1) ? 'image/tga' : (tFmt === 2 ? 'image/webp' : 'image/png');
          const blob = new Blob([u8.subarray(off, off + tLen)], { type: mime });
          off += tLen;
          try {
            bitmaps.push(await createImageBitmap(blob));
          } catch (_) {
            bitmaps.push(null);
          }
        }
      }
    }
    if (seq !== inochiLoadSeq) {
      for (const b of bitmaps) if (b && b.close) b.close();
      return;
    }

    // Flatten node tree into renderable Part list with cumulative parent transforms
    const parts = [];
    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    function walk(node, parentX, parentY, parentRot, parentSx, parentSy, parentZ) {
      if (!node || node.enabled === false) return;
      const tr = node.transform || {};
      const trans = tr.trans || [0, 0, 0];
      const rot = tr.rot || [0, 0, 0];
      const scale = tr.scale || [1, 1];
      const wx = parentX + (trans[0] || 0) * parentSx;
      const wy = parentY + (trans[1] || 0) * parentSy;
      const wRot = parentRot + (rot[2] || 0);
      const wSx = parentSx * (scale[0] !== undefined ? scale[0] : 1);
      const wSy = parentSy * (scale[1] !== undefined ? scale[1] : 1);
      const wZ = parentZ + (node.zsort || 0);

      if (node.type === 'Part' && Array.isArray(node.textures) && node.textures.length > 0) {
        const texIdx = node.textures[0];
        const bmp = bitmaps[texIdx];
        if (bmp) {
          const nm = String(node.name || '').toLowerCase();
          const opacity = node.opacity !== undefined ? Number(node.opacity) : 1.0;
          const bw = bmp.width * Math.abs(wSx);
          const bh = bmp.height * Math.abs(wSy);
          minX = Math.min(minX, wx - bw * 0.5);
          maxX = Math.max(maxX, wx + bw * 0.5);
          minY = Math.min(minY, wy - bh * 0.5);
          maxY = Math.max(maxY, wy + bh * 0.5);
          parts.push({
            name: nm, bmp, wx, wy, wRot, wSx, wSy, wZ, opacity,
            isEye: nm.includes('eye') || nm.includes('iris') || nm.includes('pupil') || nm.includes('ojo'),
            isMouth: nm.includes('mouth') || nm.includes('lip') || nm.includes('boca'),
            isHair: nm.includes('hair') || nm.includes('bang') || nm.includes('pelo') || nm.includes('ponytail'),
            isHead: nm.includes('head') || nm.includes('face') || nm.includes('eye') || nm.includes('mouth') || nm.includes('brow') || nm.includes('hair') || nm.includes('ear') || nm.includes('nose')
          });
        }
      }
      if (Array.isArray(node.children)) {
        for (const ch of node.children) walk(ch, wx, wy, wRot, wSx, wSy, wZ);
      }
    }
    walk(puppet.nodes, 0, 0, 0, 1, 1, 0);
    // Inochi2D draws higher zSort behind lower zSort
    parts.sort((a, b) => b.wZ - a.wZ);
    if (inochiModel && inochiModel.bitmaps) {
      for (const b of inochiModel.bitmaps) if (b && b.close) b.close();
    }
    inochiModel = {
      name: (puppet.meta && puppet.meta.name) || 'Inochi2D',
      bitmaps, parts,
      cx: (minX + maxX) * 0.5,
      cy: (minY + maxY) * 0.5,
      bw: Math.max(64, maxX - minX),
      bh: Math.max(64, maxY - minY)
    };
    console.log('Loaded Inochi2D puppet: ' + inochiModel.name + ' parts=' + parts.length + ' textures=' + bitmaps.length);
  } catch (e) {
    loadedInochiUrl = '';
    inochiModel = null;
    console.error('Inochi2D load failed:', e);
  }
}

function drawInochi2dAvatar(w, h, talking, blink) {
  if (!inochiModel || !inochiModel.parts.length) {
    draw2DRiggedAvatar(w, h, talking, blink);
    return;
  }
  ctx2d.clearRect(0, 0, w, h);
  ctx2d.save();
  const t = clock.elapsedTime;
  const sens = Math.max(0.4, Math.min(2.5, Number(cfg.headSensitivity) || 1.0));
  const actGest = getActiveGesture();
  const danceX = actGest === 'dance' ? Math.sin(t * 3.8) * 18 : 0;
  const danceRot = actGest === 'dance' ? Math.sin(t * 3.8) * 0.10 : 0;
  const framing = cfg.live2dFraming || 'bust';
  const fZoom = framing === 'closeup' ? 2.4 : (framing === 'full' ? 0.90 : 1.75);
  const fBaseY = framing === 'closeup' ? 1.05 : (framing === 'full' ? 0.52 : 0.82);
  const zoomMul = Math.max(0.4, Math.min(4.0, Number(cfg.live2dZoom) || 1.0));
  const offY = Math.max(-1.0, Math.min(1.0, Number(cfg.live2dOffsetY) || 0.0));
  const scale = Math.min(w / inochiModel.bw, h / inochiModel.bh) * fZoom * zoomMul;
  const breathY = Math.sin(t * 2.1) * 4;
  ctx2d.translate(w * 0.5 + danceX + sm.faceX * w * 0.03, h * (fBaseY + offY * 0.5) + breathY - bounceY * 0.25);
  ctx2d.rotate((sm.roll * sens * (cfg.invertX ? -1 : 1) * Math.PI) / 180 * 0.35 + danceRot);
  ctx2d.scale(scale, scale);
  ctx2d.translate(-inochiModel.cx, -inochiModel.cy);

  const headDx = sm.yaw * sens * (cfg.invertX ? -1 : 1) * 1.1;
  const headDy = -sm.pitch * sens * (cfg.invertY ? -1 : 1) * 0.9;
  const hairSwing = Math.sin(t * 2.6) * 0.035 + (track.roll * 0.002);
  const eyeScale = blink ? 0.08 : Math.max(0.1, (track.eyeL + track.eyeR) * 0.5);

  for (const p of inochiModel.parts) {
    ctx2d.save();
    ctx2d.globalAlpha = Math.max(0, Math.min(1, p.opacity));
    const px = p.wx + (p.isHead ? headDx : headDx * 0.22);
    const py = p.wy + (p.isHead ? headDy : headDy * 0.15);
    ctx2d.translate(px, py);
    ctx2d.rotate(p.wRot + (p.isHair ? hairSwing : 0));
    let sx = p.wSx, sy = p.wSy;
    if (p.isEye) sy *= eyeScale;
    if (p.isMouth) sy *= (0.75 + curMouthVal * 0.95);
    ctx2d.scale(sx, sy);
    ctx2d.drawImage(p.bmp, -p.bmp.width * 0.5, -p.bmp.height * 0.5);
    ctx2d.restore();
  }
  ctx2d.restore();
}

function draw2DRiggedAvatar(w, h, talking, blink) {
  ctx2d.clearRect(0, 0, w, h);
  ctx2d.save();
  const t = clock.elapsedTime;
  const actGest = getActiveGesture();
  const danceX = actGest === 'dance' ? Math.sin(t * 3.8) * w * 0.04 : 0;
  const cx = w * 0.5 + track.faceX * w * 0.04 + danceX;
  const cy = h * 0.54 + track.faceY * h * 0.03 - bounceY;
  const s = Math.min(w, h) * 0.34;
  ctx2d.translate(cx, cy);
  ctx2d.rotate((track.roll * Math.PI) / 180 * 0.65 + (actGest === 'dance' ? Math.sin(t * 3.8) * 0.12 : 0));

  ctx2d.fillStyle = '#1e293b';
  ctx2d.beginPath();
  ctx2d.ellipse(0, s * 1.05, s * 0.85, s * 0.55, 0, Math.PI, 0);
  ctx2d.fill();

  ctx2d.fillStyle = '#2563eb';
  ctx2d.beginPath();
  ctx2d.ellipse(-track.yaw * 0.6, -s * 0.05, s * 0.86, s * 0.94, 0, 0, Math.PI * 2);
  ctx2d.fill();

  const fx = track.yaw * (s * 0.006);
  const fy = -track.pitch * (s * 0.005);
  ctx2d.fillStyle = '#ffe4d0';
  ctx2d.beginPath();
  ctx2d.ellipse(fx, fy, s * 0.68, s * 0.74, 0, 0, Math.PI * 2);
  ctx2d.fill();

  const eyeScaleL = blink ? 0.08 : Math.max(0.08, track.eyeL);
  const eyeScaleR = blink ? 0.08 : Math.max(0.08, track.eyeR);
  [[-0.25, eyeScaleL], [0.25, eyeScaleR]].forEach(([ex, es]) => {
    ctx2d.save();
    ctx2d.translate(fx + s * ex, fy - s * 0.04);
    ctx2d.scale(1, es);
    ctx2d.fillStyle = '#0f172a';
    ctx2d.beginPath();
    ctx2d.ellipse(0, 0, s * 0.12, s * 0.15, 0, 0, Math.PI * 2);
    ctx2d.fill();
    ctx2d.fillStyle = '#ffffff';
    ctx2d.beginPath();
    ctx2d.arc(s * 0.04 + track.lookX * s * 0.04, -s * 0.05 - track.lookY * s * 0.04, s * 0.042, 0, Math.PI * 2);
    ctx2d.fill();
    ctx2d.restore();
  });

  const mOpen = Math.max(talking ? 0.65 : 0.06, track.mouthOpen);
  ctx2d.fillStyle = '#e11d48';
  ctx2d.beginPath();
  ctx2d.ellipse(fx, fy + s * 0.30, s * (0.14 + track.happy * 0.06), s * (0.03 + mOpen * 0.14), 0, 0, Math.PI * 2);
  ctx2d.fill();

  ctx2d.fillStyle = '#3b82f6';
  ctx2d.beginPath();
  ctx2d.arc(fx * 0.5, fy - s * 0.18, s * 0.72, Math.PI * 1.05, Math.PI * 1.95);
  ctx2d.fill();
  ctx2d.restore();

  if (cfg.mode === 'live2d' && live2dStatusText) {
    ctx2d.save();
    const fontSize = Math.max(16, Math.round(w * 0.032));
    ctx2d.font = '600 ' + fontSize + 'px sans-serif';
    ctx2d.textAlign = 'center';
    ctx2d.textBaseline = 'middle';
    const tw = Math.min(w * 0.90, ctx2d.measureText(live2dStatusText).width + 32);
    const bh = fontSize + 20;
    const bx = (w - tw) * 0.5;
    const by = h * 0.84 - bh * 0.5;
    ctx2d.fillStyle = 'rgba(15, 23, 42, 0.85)';
    ctx2d.fillRect(bx, by, tw, bh);
    ctx2d.fillStyle = '#f8fafc';
    ctx2d.fillText(live2dStatusText, w * 0.5, h * 0.84, w * 0.86);
    ctx2d.restore();
  }
}

function pushCurrentFrame(activeGl) {
  if (zeroCopyAlphaPack) return; // HardwareBuffer side-by-side alpha-pack handles capture in GPU!
  if (frameInFlight) return;
  const now = performance.now();
  const minInterval = 1000 / Math.max(10, Math.min(60, cfg.fps || 30));
  if (now - lastPushMs < minInterval) return;

  const [w, h] = getRenderSize();
  const byteLen = w * h * 4;
  let bytes = null;
  let flip = 0;

  if (activeGl) {
    if (!glPixelBuf || glPixelBuf.length !== byteLen) {
      glPixelBuf = new Uint8Array(byteLen);
    }
    activeGl.bindFramebuffer(activeGl.FRAMEBUFFER, null);
    if (activeGl.getBufferSubData) {
      bytes = asyncReadPixels(activeGl, w, h);
      if (!bytes) return;
    } else {
      activeGl.readPixels(0, 0, w, h, activeGl.RGBA, activeGl.UNSIGNED_BYTE, glPixelBuf);
      bytes = glPixelBuf;
    }
    flip = 1;
  } else {
    const imgData = ctx2d.getImageData(0, 0, w, h);
    bytes = new Uint8Array(imgData.data.buffer);
    flip = 0;
  }

  frameInFlight = true;
  lastPushMs = now;
  if (window.ObsVtuberFrames) {
    if (!messageBuffer || messageBuffer.byteLength !== byteLen + 16) messageBuffer = new ArrayBuffer(byteLen + 16);
    const header = new DataView(messageBuffer);
    header.setUint32(0, 0x4f425352, true); header.setUint32(4, w, true);
    header.setUint32(8, h, true); header.setUint32(12, flip, true);
    new Uint8Array(messageBuffer, 16).set(bytes);
    window.ObsVtuberFrames.onmessage = () => { frameInFlight = false; };
    try { window.ObsVtuberFrames.postMessage(messageBuffer); }
    catch (_) { frameInFlight = false; }
    return;
  }
  fetch('/vtuber-frame/' + instanceId + '?w=' + w + '&h=' + h + '&flip=' + flip, {
    method: 'POST',
    headers: {'X-OBS-Token': new URLSearchParams(location.hash.slice(1)).get('localToken') || ''},
    body: bytes
  }).catch(() => {}).finally(() => { frameInFlight = false; });
}

let renderBudgetFps = 60;
let lastRenderTime = 0;
function animate(now) {
  requestAnimationFrame(animate);
  if (now - lastRenderTime < 1000 / Math.max(1, Math.min(cfg.fps || 30, renderBudgetFps))) return;
  lastRenderTime = now;

  const dt = Math.min(0.033, clock.getDelta());
  resizeAll();

  const [w, h] = getRenderSize();
  const talking = cfg.lipSync && (track.mic > cfg.voiceThreshold || track.mouthOpen > 0.25);

  blinkTimer -= dt;
  if (blinkTimer <= 0) { blinkTimer = 2.5 + Math.random() * 3.0; blinkDur = 0.13; }
  if (blinkDur > 0) blinkDur -= dt;
  const autoBlink = (!track.mp && !track.vmc) && (blinkDur > 0);

  if (cfg.bounce) {
    if (talking && !wasTalking) bounceVel = 240;
    bounceVel -= 1400 * dt;
    bounceY += bounceVel * dt;
    if (bounceY < 0) { bounceY = 0; bounceVel = 0; }
  } else {
    bounceY = 0;
  }
  wasTalking = talking;

  const micMouth = cfg.lipSync ? Math.min(1, track.mic / Math.max(0.02, cfg.voiceThreshold * 3.2)) : 0;
  const mouthVal = Math.max(micMouth, track.mouthOpen);

  // Frame-rate-independent exponential damping (interpolates 15-20Hz tracker smoothly at 30-60 FPS)
  const damp = (cur, tgt, speed) => cur + (tgt - cur) * (1 - Math.exp(-dt * speed));
  sm.yaw = damp(sm.yaw, track.yaw, 9.5);
  sm.pitch = damp(sm.pitch, track.pitch, 9.5);
  sm.roll = damp(sm.roll, track.roll, 8.5);
  sm.bodyYaw = damp(sm.bodyYaw, sm.yaw, 5.5);
  sm.bodyPitch = damp(sm.bodyPitch, sm.pitch, 5.5);
  sm.bodyRoll = damp(sm.bodyRoll, sm.roll, 5.0);
  sm.faceX = damp(sm.faceX, track.faceX || 0, 6.0);
  sm.faceY = damp(sm.faceY, track.faceY || 0, 6.0);
  sm.eyeL = damp(sm.eyeL, track.eyeL, 22.0);
  sm.eyeR = damp(sm.eyeR, track.eyeR, 22.0);
  sm.eyeSmileL = damp(sm.eyeSmileL, track.eyeSmileL || 0, 14.0);
  sm.eyeSmileR = damp(sm.eyeSmileR, track.eyeSmileR || 0, 14.0);
  sm.eyeWideL = damp(sm.eyeWideL, track.eyeWideL || 0, 16.0);
  sm.eyeWideR = damp(sm.eyeWideR, track.eyeWideR || 0, 16.0);
  sm.lookX = damp(sm.lookX, track.lookX, 15.0);
  sm.lookY = damp(sm.lookY, track.lookY, 15.0);
  sm.browL = damp(sm.browL, track.browL || 0, 13.0);
  sm.browR = damp(sm.browR, track.browR || 0, 13.0);
  sm.browAngleL = damp(sm.browAngleL, track.browAngleL || 0, 12.0);
  sm.browAngleR = damp(sm.browAngleR, track.browAngleR || 0, 12.0);
  sm.cheekPuff = damp(sm.cheekPuff, track.cheekPuff || 0, 12.0);
  // Crisp fast-attack, smooth-release lip-sync
  sm.mouth = damp(sm.mouth, mouthVal, mouthVal > sm.mouth ? 26.0 : 15.0);
  sm.mouthForm = damp(sm.mouthForm, track.mouthForm || 0, 16.0);
  sm.mouthX = damp(sm.mouthX, track.mouthX || 0, 16.0);
  sm.mA = damp(sm.mA, Math.max(track.mA, micMouth * 0.85), 22.0);
  sm.mI = damp(sm.mI, track.mI, 18.0);
  sm.mU = damp(sm.mU, track.mU, 18.0);
  sm.mE = damp(sm.mE, track.mE, 18.0);
  sm.mO = damp(sm.mO, track.mO, 18.0);

  curAutoBlink = autoBlink;
  curMouthVal = sm.mouth;

  let activeGl = null;
  let activeCanvas = c2d;
  const setLayerVis = (active) => {
    for (const el of [c2d, cgl, cl2d]) {
      if (zeroCopyAlphaPack) {
        el.style.display = (el === active) ? 'block' : 'none';
        el.style.visibility = 'hidden';
      } else {
        el.style.display = (el === active) ? 'block' : 'none';
        el.style.visibility = 'visible';
      }
    }
  };
  if (cfg.mode === 'vrm') {
    setLayerVis(cgl);
    ensureThree();
    camera.position.set(0, cfg.camY, cfg.camDist);
    camera.lookAt(0, cfg.camY - 0.03, 0);

    const sens = Math.max(0.4, Math.min(2.5, Number(cfg.headSensitivity) || 1.0));
    const invX = cfg.invertX ? -1 : 1;
    const invY = cfg.invertY ? -1 : 1;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const lerp = (a, b, f) => a + (b - a) * f;
    const yawDeg = clamp(sm.yaw * sens * invX, -38, 38);
    const pitchDeg = clamp(sm.pitch * sens * invY, -28, 28);
    const rollDeg = clamp(sm.roll * sens * invX, -32, 32);
    const yawR = (yawDeg * Math.PI) / 180;
    const pitchR = (pitchDeg * Math.PI) / 180;
    const rollR = (rollDeg * Math.PI) / 180;
    const bYawR = (clamp(sm.bodyYaw * sens * invX, -38, 38) * Math.PI) / 180;
    const bPitchR = (clamp(sm.bodyPitch * sens * invY, -28, 28) * Math.PI) / 180;
    const bRollR = (clamp(sm.bodyRoll * sens * invX, -32, 32) * Math.PI) / 180;

    if (currentVrm) {
      const t = clock.elapsedTime;
      const breath = Math.sin(t * 2.1);
      const sway = Math.sin(t * 0.9);
      const handOn = cfg.handTracking !== false;
      const actGest = getActiveGesture();

      // If a .vrma clip is loaded, advance AnimationMixer first (face/expressions still layer on top)
      const hasVrma = !!(vrmaMixer && vrmaAction);
      if (hasVrma) {
        vrmaMixer.update(dt);
      }

      const hum = currentVrm.humanoid;
      const hasVmcBones = !!(track.vmc && track.bones && Object.keys(track.bones).length > 1);

      if (!hasVrma && hasVmcBones) {
        // Full VMC skeleton bone streaming
        for (const [vmcName, q] of Object.entries(track.bones)) {
          const vrmBone = VMC_TO_VRM_BONE[vmcName];
          if (!vrmBone || !Array.isArray(q) || q.length < 4) continue;
          const node = hum?.getNormalizedBoneNode(vrmBone);
          if (!node) continue;
          tmpQuat.set(-q[0], -q[1], q[2], q[3]).normalize();
          node.quaternion.slerp(tmpQuat, 0.45);
        }
      } else if (!hasVrma) {
        // Kalidokit-style IK + MediaPipe Hand Landmarker + 6 Procedural Gestures
        let tgtL = handOn ? clamp(track.handL || 0, 0, 1) : 0;
        let tgtR = handOn ? clamp(track.handR || 0, 0, 1) : 0;
        if (actGest === 'wave') tgtR = 1.0;
        else if (actGest === 'peace') tgtR = 1.0;
        else if (actGest === 'clap') { tgtL = 1.0; tgtR = 1.0; }
        else if (actGest === 'think') tgtR = 1.0;

        vrmWaveL += (tgtL - vrmWaveL) * (tgtL > vrmWaveL ? 0.24 : 0.14);
        vrmWaveR += (tgtR - vrmWaveR) * (tgtR > vrmWaveR ? 0.24 : 0.14);
        const waveOsc = Math.sin(t * 7.6) * 0.68 + clamp(track.waveOsc || 0, -1, 1) * 0.32;

        const head = hum?.getNormalizedBoneNode('head');
        const neck = hum?.getNormalizedBoneNode('neck');
        const spine = hum?.getNormalizedBoneNode('spine');
        const chest = hum?.getNormalizedBoneNode('chest') || hum?.getNormalizedBoneNode('upperChest');
        const lShoulder = hum?.getNormalizedBoneNode('leftShoulder');
        const rShoulder = hum?.getNormalizedBoneNode('rightShoulder');
        const lUpper = hum?.getNormalizedBoneNode('leftUpperArm');
        const rUpper = hum?.getNormalizedBoneNode('rightUpperArm');
        const lLower = hum?.getNormalizedBoneNode('leftLowerArm');
        const rLower = hum?.getNormalizedBoneNode('rightLowerArm');
        const lHand = hum?.getNormalizedBoneNode('leftHand');
        const rHand = hum?.getNormalizedBoneNode('rightHand');

        // Hand position IK elevation from MediaPipe wrist Y (0=top, 1=bottom)
        const liftL = clamp((0.88 - (track.handLY || 0.75)) * 1.6, 0, 1);
        const liftR = clamp((0.88 - (track.handRY || 0.75)) * 1.6, 0, 1);
        const spreadL = clamp(((track.handLX || 0.25) - 0.5) * 1.4, -0.6, 0.6);
        const spreadR = clamp(((track.handRX || 0.75) - 0.5) * 1.4, -0.6, 0.6);

        if (lShoulder) lShoulder.rotation.set(0, 0, lerp(0.05 - breath * 0.012, -0.18, vrmWaveL));
        if (rShoulder) rShoulder.rotation.set(0, 0, lerp(-0.05 + breath * 0.012, 0.18, vrmWaveR));

        if (actGest === 'clap') {
          const cl = 0.5 - 0.5 * Math.cos(t * 14.0);
          if (lShoulder) lShoulder.rotation.set(0, 0.10, 0.04);
          if (rShoulder) rShoulder.rotation.set(0, -0.10, -0.04);
          if (lUpper) lUpper.rotation.set(0.20, 0.55 + cl * 0.22, 0.85);
          if (rUpper) rUpper.rotation.set(0.20, -0.55 - cl * 0.22, -0.85);
          if (lLower) lLower.rotation.set(0.15, 0.95 + cl * 0.45, -0.35);
          if (rLower) rLower.rotation.set(0.15, -0.95 - cl * 0.45, 0.35);
          if (lHand) lHand.rotation.set(0, 0.15, 0.25);
          if (rHand) rHand.rotation.set(0, -0.15, -0.25);
        } else if (actGest === 'peace') {
          if (lShoulder) lShoulder.rotation.set(0, 0, 0.05 - breath * 0.012);
          if (rShoulder) rShoulder.rotation.set(0, 0, 0.14);
          if (lUpper) lUpper.rotation.set(0.08, 0.06, 1.22 - breath * 0.025);
          if (lLower) lLower.rotation.set(0.05, 0.14, 0.10);
          if (lHand) lHand.rotation.set(0, 0, 0);
          if (rUpper) rUpper.rotation.set(-0.32, -0.48, -0.45);
          if (rLower) rLower.rotation.set(-0.18, -0.45, 1.85);
          if (rHand) rHand.rotation.set(0.10, -0.35, -0.18);
        } else if (actGest === 'think') {
          if (lUpper) lUpper.rotation.set(0.08, 0.06, 1.22);
          if (lLower) lLower.rotation.set(0.05, 0.14, 0.10);
          if (lHand) lHand.rotation.set(0, 0, 0);
          if (rUpper) rUpper.rotation.set(-0.65, -0.25, -0.35);
          if (rLower) rLower.rotation.set(-0.35, -0.45, 1.65);
          if (rHand) rHand.rotation.set(0, 0, 0);
        } else if (actGest === 'dance') {
          const d = Math.sin(t * 3.8);
          if (lUpper) lUpper.rotation.set(-0.25, 0.12, 0.65 + d * 0.45);
          if (rUpper) rUpper.rotation.set(-0.25, -0.12, -0.65 + d * 0.45);
          if (lLower) lLower.rotation.set(-0.20, 0.35, -0.65 - d * 0.35);
          if (rLower) rLower.rotation.set(-0.20, -0.35, 0.65 - d * 0.35);
          if (lHand) lHand.rotation.set(0, 0, 0);
          if (rHand) rHand.rotation.set(0, 0, 0);
        } else {
          if (lUpper) lUpper.rotation.set(
            lerp(0.08, -0.35 - liftL * 0.25, vrmWaveL),
            lerp(0.06, -0.18 + spreadL * 0.35, vrmWaveL),
            lerp(1.22 - breath * 0.025, -0.32 + (1 - liftL) * 0.45, vrmWaveL)
          );
          if (rUpper) rUpper.rotation.set(
            lerp(0.08, -0.35 - liftR * 0.25, vrmWaveR),
            lerp(-0.06, 0.18 + spreadR * 0.35, vrmWaveR),
            lerp(-1.22 + breath * 0.025, 0.32 - (1 - liftR) * 0.45, vrmWaveR)
          );
          const liveOsc = (actGest === 'wave') ? waveOsc * 0.42 : clamp(track.waveOsc || 0, -1, 1) * 0.28;
          if (lLower) lLower.rotation.set(
            lerp(0.05, -0.22, vrmWaveL),
            lerp(0.14, 0.05, vrmWaveL),
            lerp(0.10, -1.35 - liveOsc, vrmWaveL)
          );
          if (rLower) rLower.rotation.set(
            lerp(0.05, -0.22, vrmWaveR),
            lerp(-0.14, -0.05, vrmWaveR),
            lerp(-0.10, 1.35 + liveOsc, vrmWaveR)
          );
          if (lHand) lHand.rotation.set(0, 0, -liveOsc * 0.65 * vrmWaveL);
          if (rHand) rHand.rotation.set(0, 0, liveOsc * 0.65 * vrmWaveR);
        }

        // Only apply finger pose when hand is actively raised or gesture requested
        if (actGest === 'clap') {
          applyVrmFingers(hum, 'L', 0.05, 1);
          applyVrmFingers(hum, 'R', 0.05, 1);
        } else if (actGest === 'peace') {
          applyVrmFingers(hum, 'L', 0.15, 0);
          applyVrmFingers(hum, 'R', 0, 3);
        } else {
          if (vrmWaveL > 0.15) applyVrmFingers(hum, 'L', track.curlL || 0, track.gestL || 0);
          else applyVrmFingers(hum, 'L', 0.15, 0);
          if (vrmWaveR > 0.15) applyVrmFingers(hum, 'R', track.curlR || 0, actGest === 'wave' ? 1 : (track.gestR || 0));
          else applyVrmFingers(hum, 'R', 0.15, 0);
        }

        const danceRoll = actGest === 'dance' ? Math.sin(t * 3.8) * 0.14 : 0;
        const thinkTilt = actGest === 'think' ? -0.18 : 0;
        const peaceTilt = actGest === 'peace' ? 0.16 : 0;
        const clapBob = actGest === 'clap' ? (0.5 - 0.5 * Math.cos(t * 14.0)) * 0.08 : 0;
        // On VRM0 after rotateVRM0 (+Z world forward), positive local X rotation tilts face UP
        if (chest) chest.rotation.set(breath * 0.022 + bPitchR * 0.12 - clapBob * 0.5, sway * 0.018 + bYawR * 0.10 + (actGest === 'dance' ? Math.sin(t * 3.8) * 0.12 : 0), bRollR * 0.08 + danceRoll * 0.5 + (actGest === 'peace' ? 0.05 : 0));
        if (head) head.rotation.set(pitchR * 0.68 + (actGest === 'think' ? -0.12 : 0) + clapBob, yawR * 0.62 + (actGest === 'peace' ? -0.08 : 0), rollR * 0.62 + (actGest === 'wave' ? (vrmWaveR - vrmWaveL) * 0.08 : 0) + thinkTilt + peaceTilt);
        if (neck) neck.rotation.set(bPitchR * 0.28, bYawR * 0.24, bRollR * 0.24);
        if (spine) spine.rotation.set(bPitchR * 0.10 + breath * 0.012, bYawR * 0.08 + sway * 0.015, bRollR * 0.06 + danceRoll * 0.4);
      }

      currentVrm.scene.position.x = 0;
      currentVrm.scene.position.y = clamp(-sm.faceY * 0.028, -0.04, 0.04);

      // Full 52-ARKit-driven VRM Expressions + 5-vowel visemes + Eye Gaze
      const em = currentVrm.expressionManager;
      if (em) {
        const maxWave = Math.max(vrmWaveL, vrmWaveR);
        const gestHappy = (actGest === 'happy' || actGest === 'peace' || actGest === 'clap') ? 0.95 : 0;
        if (track.mp || track.vmc) {
          em.setValue('aa', sm.mA);
          em.setValue('ih', sm.mI);
          em.setValue('ou', sm.mU);
          em.setValue('ee', sm.mE);
          em.setValue('oh', sm.mO);
          em.setValue('lookLeft', clamp(-sm.lookX, 0, 1));
          em.setValue('lookRight', clamp(sm.lookX, 0, 1));
          em.setValue('lookUp', clamp(sm.lookY, 0, 1));
          em.setValue('lookDown', clamp(-sm.lookY, 0, 1));
        } else {
          em.setValue('aa', sm.mouth);
          em.setValue('ih', 0); em.setValue('ou', 0); em.setValue('ee', 0); em.setValue('oh', 0);
        }
        em.setValue('blinkLeft', autoBlink ? 1 : clamp(1 - sm.eyeL, 0, 1));
        em.setValue('blinkRight', (autoBlink || actGest === 'peace') ? 1 : clamp(1 - sm.eyeR, 0, 1));
        em.setValue('happy', clamp(Math.max(track.happy, maxWave * 0.55, gestHappy), 0, 1));
        em.setValue('sad', clamp(track.sad || 0, 0, 1));
        em.setValue('angry', clamp(track.angry || 0, 0, 1));
        em.setValue('surprised', clamp(track.surprised || 0, 0, 1));
      }
      if (vrmSettleFrames > 0) {
        vrmSettleFrames--;
        currentVrm.update(0.001);
        currentVrm.scene.updateMatrixWorld(true);
        if (currentVrm.springBoneManager) currentVrm.springBoneManager.reset();
      } else {
        currentVrm.update(dt);
      }
    } else if (demoHead) {
      const u = demoHead.userData;
      u.head.rotation.set(-pitchR * 0.9, yawR * 0.9, -rollR * 0.8);
      u.eyeL.scale.y = autoBlink ? 0.1 : Math.max(0.1, sm.eyeL);
      u.eyeR.scale.y = autoBlink ? 0.1 : Math.max(0.1, sm.eyeR);
      u.mouth.scale.y = 0.18 + sm.mouth * 0.95;
    }
    renderer.render(scene, camera);
    activeGl = renderer.getContext();
    activeCanvas = cgl;
  } else if (cfg.mode === 'live2d' && live2dModel && pixiApp) {
    setLayerVis(cl2d);
    if (live2dModel.internalModel && live2dModel.internalModel.focusController) {
      // Keep focusController centered so it never fights or doubles our MediaPipe/VMC parameters
      live2dModel.internalModel.focusController.focus(0, 0, true);
    }
    // Feed tracking parameters BEFORE update() so Cubism physics3.json reacts to head & body movement!
    applyLive2dParams(live2dModel);
    live2dModel.update(dt * 1000);
    pixiApp.render();
    activeGl = pixiApp.renderer && pixiApp.renderer.gl ? pixiApp.renderer.gl : null;
    activeCanvas = cl2d;
  } else if (cfg.mode === 'inochi2d') {
    setLayerVis(c2d);
    drawInochi2dAvatar(w, h, talking, autoBlink);
    activeGl = null;
    activeCanvas = c2d;
  } else {
    setLayerVis(c2d);
    draw2DRiggedAvatar(w, h, talking, autoBlink);
    activeGl = null;
    activeCanvas = c2d;
  }

  if (zeroCopyAlphaPack) {
    packZeroCopyCanvas(activeCanvas, w, h);
  } else {
    pushCurrentFrame(activeGl);
  }
}

window.OBS_VTUBER = {
  setRenderBudget(fps) { renderBudgetFps = Math.max(1, Math.min(60, Number(fps) || 30)); },
  onCubismInstalled() {
    cubismReady = false;
    loadedLive2dUrl = '';
    if (cfg.mode === 'live2d' && cfg.live2dFile) loadLive2dModel(cfg.live2dFile);
  },
  setManualExpression(key, active) {
    if (!key || key === 'reset') {
      manualExp.happy = false; manualExp.gloom = false; manualExp.star = false;
      manualExp.cry = false; manualExp.coat = false;
      return;
    }
    if (key in manualExp) manualExp[key] = !!active;
  },
  setConfig(next) {
    cfg = Object.assign(cfg, next || {});
    resizeAll();
    if (cfg.mode === 'vrm') {
      loadVrmModel(cfg.vrmFile);
      loadVrmaAnimation(cfg.vrmaFile);
    } else if (cfg.mode === 'live2d') {
      fitLive2dModel();
      loadLive2dModel(cfg.live2dFile);
    } else if (cfg.mode === 'inochi2d') {
      loadInochi2dModel(cfg.inochiFile);
    }
  },
  updateTrackingV2(data) {
    if (!data || typeof data !== 'object') return;
    const smooth = (c, t, f = 0.28) => c + ((t || 0) - c) * f;
    track.yaw = data.yaw || 0;
    track.pitch = data.pitch || 0;
    track.roll = data.roll || 0;
    track.eyeL = data.eyeL !== undefined ? data.eyeL : 1;
    track.eyeR = data.eyeR !== undefined ? data.eyeR : 1;
    track.eyeSmileL = data.eyeSmileL || 0;
    track.eyeSmileR = data.eyeSmileR || 0;
    track.eyeWideL = data.eyeWideL || 0;
    track.eyeWideR = data.eyeWideR || 0;
    track.lookX = smooth(track.lookX, data.lookX, 0.38);
    track.lookY = smooth(track.lookY, data.lookY, 0.38);
    track.browL = smooth(track.browL, data.browL, 0.36);
    track.browR = smooth(track.browR, data.browR, 0.36);
    track.browAngleL = smooth(track.browAngleL, data.browAngleL, 0.34);
    track.browAngleR = smooth(track.browAngleR, data.browAngleR, 0.34);
    track.cheekPuff = smooth(track.cheekPuff, data.cheekPuff, 0.32);
    track.mouthOpen = data.mouthOpen || 0;
    track.mouthForm = data.mouthForm || 0;
    track.mouthX = data.mouthX || 0;
    track.mFunnel = data.mFunnel || 0;
    track.mPucker = data.mPucker || 0;
    track.mShrug = data.mShrug || 0;
    track.mA = smooth(track.mA, data.mA, 0.45);
    track.mI = smooth(track.mI, data.mI, 0.45);
    track.mU = smooth(track.mU, data.mU, 0.45);
    track.mE = smooth(track.mE, data.mE, 0.45);
    track.mO = smooth(track.mO, data.mO, 0.45);
    track.happy = smooth(track.happy, data.happy, 0.26);
    track.sad = smooth(track.sad, data.sad, 0.26);
    track.angry = smooth(track.angry, data.angry, 0.26);
    track.surprised = smooth(track.surprised, data.surprised, 0.28);
    track.faceX = data.faceX || 0;
    track.faceY = data.faceY || 0;
    track.mic = data.mic || 0;
    track.faceDetected = !!data.detected;
    track.mp = !!data.mp;
    track.vmc = !!data.vmc;
    track.handL = data.handL || 0;
    track.handR = data.handR || 0;
    track.handLX = smooth(track.handLX, data.handLX !== undefined ? data.handLX : 0.25, 0.32);
    track.handLY = smooth(track.handLY, data.handLY !== undefined ? data.handLY : 0.75, 0.32);
    track.handRX = smooth(track.handRX, data.handRX !== undefined ? data.handRX : 0.75, 0.32);
    track.handRY = smooth(track.handRY, data.handRY !== undefined ? data.handRY : 0.75, 0.32);
    track.curlL = smooth(track.curlL, data.curlL || 0, 0.35);
    track.curlR = smooth(track.curlR, data.curlR || 0, 0.35);
    track.gestL = data.gestL || 0;
    track.gestR = data.gestR || 0;
    track.waveOsc = data.waveOsc || 0;
    track.gesture = data.gesture || '';
    track.bones = data.bones || null;
  },
  updateTracking(yaw, pitch, roll, eyeL, eyeR, mouthOpen, happy, faceX, faceY, mic, detected, handL, handR, waveOsc, sad, angry, surprised) {
    track.yaw = yaw; track.pitch = pitch; track.roll = roll;
    track.eyeL = eyeL; track.eyeR = eyeR; track.mouthOpen = mouthOpen;
    const smooth = (current, target) => current + ((target || 0) - current) * 0.24;
    track.happy = smooth(track.happy, happy);
    track.sad = smooth(track.sad, sad);
    track.angry = smooth(track.angry, angry);
    track.surprised = smooth(track.surprised, surprised);
    track.faceX = faceX; track.faceY = faceY;
    track.mic = mic; track.faceDetected = !!detected;
    if (handL !== undefined) track.handL = handL;
    if (handR !== undefined) track.handR = handR;
    if (waveOsc !== undefined) track.waveOsc = waveOsc;
  }
};

if (window.__OBS_VTUBER_PENDING_CFG) {
  window.OBS_VTUBER.setConfig(window.__OBS_VTUBER_PENDING_CFG);
}
if (zeroCopyAlphaPack) initZeroCopyPacker();
resizeAll();
requestAnimationFrame(animate);
</script>
</body>
</html>
